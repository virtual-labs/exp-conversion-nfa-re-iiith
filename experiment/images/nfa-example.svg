<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="160" viewBox="0 0 500 160">
  <style>text{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#111827}</style>
  <!-- States -->
  <circle cx="80" cy="80" r="28" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="80" y="86" text-anchor="middle">q0</text>

  <circle cx="240" cy="40" r="28" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="240" y="46" text-anchor="middle">q1</text>

  <circle cx="240" cy="120" r="28" fill="#dcfce7" stroke="#374151" stroke-width="2" />
  <text x="240" y="126" text-anchor="middle">q2</text>

  <!-- Start arrow -->
  <line x1="30" y1="80" x2="52" y2="80" stroke="#374151" stroke-width="2" />
  <polygon points="52,80 44,75 44,85" fill="#374151" />

  <!-- Transitions -->
  <path d="M108 75 Q 170 55 212 52" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="160" y="45" text-anchor="middle">a</text>

  <path d="M108 85 Q 170 105 212 108" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="160" y="115" text-anchor="middle">b</text>

  <!-- Self loop on q2 -->
  <path d="M268 120 Q 300 80 268 120" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="300" y="82">a,b</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151" />
    </marker>
  </defs>

  <text x="10" y="15" font-weight="600">NFA Example</text>
</svg>
