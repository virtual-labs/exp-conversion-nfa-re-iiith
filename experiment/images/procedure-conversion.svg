<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <style>text{font-family:Inter, Arial, sans-serif; fill:#111827}</style>

  <!-- Panel 1: Initial NFA -->
  <rect x="10" y="10" width="280" height="200" rx="8" fill="#fff" stroke="#e6e6e6" />
  <text x="150" y="28" font-weight="700" text-anchor="middle">Initial NFA</text>
  <!-- states -->
  <circle cx="70" cy="110" r="26" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="70" y="116" text-anchor="middle">p</text>
  <circle cx="150" cy="110" r="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" />
  <text x="150" y="116" text-anchor="middle">r</text>
  <circle cx="230" cy="110" r="26" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="230" y="116" text-anchor="middle">q</text>
  <!-- transitions -->
  <path d="M96 104 Q 120 92 136 92" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="112" y="84" text-anchor="middle">a</text>
  <path d="M164 92 Q 190 92 214 104" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="190" y="84" text-anchor="middle">b</text>
  <path d="M178 136 Q 150 156 122 136" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="150" y="164" text-anchor="middle">c</text>

  <!-- Panel 2: After elimination (new transition) -->
  <rect x="310" y="10" width="280" height="200" rx="8" fill="#fff" stroke="#e6e6e6" />
  <text x="450" y="28" font-weight="700" text-anchor="middle">After eliminating r</text>
  <circle cx="360" cy="110" r="26" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="360" y="116" text-anchor="middle">p</text>
  <circle cx="530" cy="110" r="26" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="530" y="116" text-anchor="middle">q</text>
  <path d="M386 100 Q 420 70 500 100" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)" />
  <text x="440" y="80" text-anchor="middle" font-weight="600">a·(c)*·b</text>

  <!-- Panel 3: Final regex -->
  <rect x="610" y="10" width="280" height="200" rx="8" fill="#fff" stroke="#e6e6e6" />
  <text x="750" y="28" font-weight="700" text-anchor="middle">Final Regular Expression</text>
  <rect x="640" y="64" width="220" height="56" rx="6" fill="#111827" opacity="0.05" />
  <text x="750" y="90" font-size="14" text-anchor="middle">a · (c)* · b </text>

  <defs>
    <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#10b981" />
    </marker>
    <marker id="arrow-orange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- separators / arrows between panels -->
  <path d="M290 110 L310 110" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-right)" />
  <path d="M590 110 L610 110" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-right)" />
  <defs>
    <marker id="arrow-right" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#6b7280" />
    </marker>
  </defs>
</svg>
