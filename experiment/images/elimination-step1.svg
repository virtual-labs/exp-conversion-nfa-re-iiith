<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140">
  <style>text{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#111827}</style>
  <text x="12" y="20" font-weight="600">Elimination: incoming / outgoing</text>

  <!-- p -->
  <circle cx="70" cy="80" r="22" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="70" y="86" text-anchor="middle">p</text>

  <!-- r (to be eliminated) -->
  <circle cx="260" cy="80" r="26" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" />
  <text x="260" y="86" text-anchor="middle">r</text>

  <!-- q -->
  <circle cx="435" cy="80" r="22" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="435" y="86" text-anchor="middle">q</text>

  <!-- incoming -->
  <path d="M98 78 Q 160 56 232 64" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="165" y="60" text-anchor="middle" font-weight="600">a</text>

  <!-- outgoing -->
  <path d="M288 64 Q 340 56 412 72" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="350" y="60" text-anchor="middle" font-weight="600">b</text>

  <!-- self-loop on r (curved, visible) -->
    <path d="M286 50 C 306 6 214 6 234 50" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-purple)"/>
  <text x="260" y="14" text-anchor="middle" font-weight="700" fill="#4c1d95">c</text>

  <defs>
    <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#10b981" />
    </marker>
    <marker id="arrow-orange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-purple" markerWidth="6" markerHeight="6" refX="2" refY="3" >
      <path d="M1 0 L6 3 L0 6 z" fill="#8b5cf6" />
    </marker>
  </defs>
  <rect x="20" y="100" width="520" height="28" fill="#eef2ff" rx="6" />
  <text x="280" y="119" font-size="12" text-anchor="middle">New transitions combine: incoming · (self-loop)* · outgoing</text>
</svg>
